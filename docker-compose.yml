version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: verifai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verifai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verifai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-verifai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifai -d verifai"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    container_name: verifai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/verifai_neo4j_secret}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://verifai:verifai_secret@db:5432/verifai
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: verifai_neo4j_secret
      SECRET_KEY: ${SECRET_KEY:-verifai_super_secure_key_change_in_production_32b}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes:
      - ./backend/vault_storage:/app/vault_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifai-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
